<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" width="340" height="60">
  <!-- Tiny I-beam mark to the left, vertically centered with text -->
  <g transform="translate(0, 8)">
    <rect x="0" y="0"  width="18" height="4" rx="0.5" fill="#C0392B"/>
    <rect x="7"  y="4"  width="4"  height="18" fill="#C0392B"/>
    <rect x="0" y="22" width="18" height="4" rx="0.5" fill="#C0392B"/>
  </g>

  <!-- Wordmark — same style, offset right of icon -->
  <text
    x="28" y="38"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="32"
    font-weight="700"
    letter-spacing="-0.8"
    fill="#111111"
  >She Sells Red Iron</text>
</svg>
